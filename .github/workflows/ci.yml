name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [macos-26, macos-26-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen xcbeautify swiftlint swiftformat
      - run: make lint
      - run: swiftformat --lint .
      - run: make test
