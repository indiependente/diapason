name: Diapason

options:
  deploymentTarget:
    macOS: "26.0"
  developmentLanguage: en
  bundleIdPrefix: com.indiependente
  createIntermediateGroups: true
  generateEmptyDirectories: true
  groupSortPosition: top
  xcodeVersion: "26.0"

configs:
  Debug: debug
  Release: release

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    CLANG_ENABLE_MODULES: YES
    SWIFT_STRICT_CONCURRENCY: complete
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""

packages:
  ViewInspector:
    url: https://github.com/nalexn/ViewInspector
    exactVersion: "0.10.3"

targets:
  Diapason:
    type: application
    platform: macOS
    sources:
      - path: Sources/Diapason
    info:
      path: Sources/Diapason/Info.plist
      properties:
        CFBundleDisplayName: Diapason
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSApplicationCategoryType: public.app-category.music
        NSHumanReadableCopyright: "Copyright (c) 2026 Francesco Farina"
        # Home Jellyfin servers are plain http.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.indiependente.Diapason
        PRODUCT_NAME: Diapason
        CODE_SIGN_ENTITLEMENTS: Sources/Diapason/Diapason.entitlements
        ENABLE_HARDENED_RUNTIME: NO
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

  DiapasonTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/DiapasonTests
    dependencies:
      - target: Diapason
      - package: ViewInspector
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.indiependente.DiapasonTests
        GENERATE_INFOPLIST_FILE: YES
        BUNDLE_LOADER: "$(TEST_HOST)"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Diapason.app/Contents/MacOS/Diapason"

  DiapasonUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: Tests/DiapasonUITests
    dependencies:
      - target: Diapason
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.indiependente.DiapasonUITests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Diapason

schemes:
  Diapason:
    build:
      targets:
        Diapason: all
        DiapasonTests: [test]
        DiapasonUITests: [test]
    test:
      targets:
        - DiapasonTests
        - DiapasonUITests
      gatherCoverageData: true
    run:
      config: Debug
    archive:
      config: Release
